[package]
name = "aethoria"
version = "1.0.0"
description = "Aethoria desktop platform runtime"
authors = ["Aethoria contributors"]
edition = "2021"

[lib]
name = "aethoria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
